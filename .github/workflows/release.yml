name: Publish packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use the trusted-publishing npm version
        run: |
          npm install --global npm@11.6.2
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.6.2"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @plugload/example-payload-app build
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "${RELEASE_TAG#v}" = "$(node -p "require('./packages/core/package.json').version")"
      - run: pnpm --filter './packages/**' publish --no-git-checks
